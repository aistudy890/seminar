<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');

:root {
    --main: #ed8954;
    --dark: #d96e3b;
    --bg: #fff9f4;
    --text: #39332f;
    --sub: #897e75;
    --border: #eee5de;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Pretendard', sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    padding: 22px 7%;
    background: white;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
}

.logo {
    color: var(--dark);
    font-size: 22px;
    font-weight: 800;
}

.header-text {
    color: var(--sub);
    font-size: 12px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 50px 22px 80px;
}

.intro {
    text-align: center;
    margin-bottom: 35px;
}

.intro .emoji {
    font-size: 48px;
}

.intro h1 {
    font-size: 36px;
    margin: 12px 0;
}

.intro h1 span {
    color: var(--main);
}

.intro p {
    color: var(--sub);
    font-size: 14px;
}

.mode-area {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 35px;
}

.mode-btn {
    width: 155px;
    padding: 16px;
    border: 2px solid var(--border);
    border-radius: 13px;
    background: white;
    color: var(--sub);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.mode-btn.active {
    background: var(--main);
    border-color: var(--main);
    color: white;
}

.selection-box {
    background: white;
    padding: 35px;
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 30px #49311a0b;
}

.selection-title {
    margin-bottom: 30px;
}

.selection-title h2 {
    font-size: 21px;
    margin-bottom: 8px;
}

.selection-title p {
    color: var(--sub);
    font-size: 13px;
}

.category {
    margin-bottom: 27px;
}

.category-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 13px;
    display: flex;
    align-items: center;
    gap: 9px;
}

.category-title span {
    font-size: 19px;
}

.options {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
}

.option {
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 10px 16px;
    background: #fffdfb;
    color: #766b63;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    border-color: var(--main);
    color: var(--dark);
}

.option.selected {
    background: #fff0e7;
    border-color: var(--main);
    color: var(--dark);
}

.selected-count {
    border-top: 1px solid var(--border);
    padding-top: 20px;
    margin-top: 25px;
    color: var(--dark);
    font-size: 13px;
    font-weight: 700;
}

.action-area {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.recommend-btn {
    flex: 1;
    padding: 17px;
    border: none;
    border-radius: 12px;
    background: var(--main);
    color: white;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
}

.recommend-btn:hover {
    background: var(--dark);
}

.reset-btn {
    padding: 17px 22px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: white;
    color: var(--sub);
    font-weight: 700;
    cursor: pointer;
}

.result-section {
    display: none;
    margin-top: 50px;
    animation: fadeIn 0.4s ease;
}

.result-heading {
    text-align: center;
    margin-bottom: 25px;
}

.result-heading .emoji {
    font-size: 35px;
}

.result-heading h2 {
    font-size: 25px;
    margin: 10px 0;
}

.result-heading p {
    color: var(--sub);
    font-size: 13px;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.food-card {
    background: white;
    padding: 25px 17px;
    border: 1px solid var(--border);
    border-radius: 17px;
    text-align: center;
    box-shadow: 0 5px 20px #49311a08;
    transition: 0.2s;
}

.food-card:hover {
    transform: translateY(-5px);
}

.food-number {
    color: var(--main);
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 12px;
}

.food-emoji {
    font-size: 43px;
    margin-bottom: 12px;
}

.food-card h3 {
    font-size: 18px;
    margin-bottom: 10px;
}

.food-card p {
    font-size: 12px;
    color: var(--sub);
    line-height: 1.6;
    min-height: 40px;
}

.food-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
    margin-top: 15px;
}

.food-tags span {
    background: #fff1e8;
    color: #b96d46;
    border-radius: 20px;
    padding: 5px 8px;
    font-size: 10px;
}

.result-notice {
    text-align: center;
    margin-top: 22px;
    color: var(--sub);
    font-size: 12px;
    line-height: 1.7;
}

footer {
    text-align: center;
    padding: 30px;
    color: #aaa098;
    font-size: 12px;
    border-top: 1px solid var(--border);
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(15px);}
    to {opacity: 1; transform: translateY(0);}
}

/* 저녁 모드: 사이트 전체를 차분한 다크 테마로 전환 */
body, header, .selection-box, .mode-btn, .option, .food-card, .reset-btn {
    transition: background-color .25s ease, color .25s ease, border-color .25s ease, box-shadow .25s ease;
}

body.dinner-mode {
    --main: #d99a62;
    --dark: #efb47c;
    --bg: #17191f;
    --text: #eee9e2;
    --sub: #aaa5a0;
    --border: #383b44;
    background: var(--bg);
    color: var(--text);
}

body.dinner-mode header {
    background: #20232b;
    border-bottom-color: var(--border);
}

body.dinner-mode .selection-box,
body.dinner-mode .food-card {
    background: #22252e;
    border-color: #393d48;
    box-shadow: 0 8px 28px #00000030;
}

body.dinner-mode .mode-btn,
body.dinner-mode .reset-btn {
    background: #252832;
    border-color: #414550;
    color: #c3beb8;
}

body.dinner-mode .mode-btn.active,
body.dinner-mode .recommend-btn {
    background: var(--main);
    border-color: var(--main);
    color: #211b16;
}

body.dinner-mode .option {
    background: #292d37;
    border-color: #454a56;
    color: #d0cbc5;
}

body.dinner-mode .option:hover {
    border-color: var(--main);
    color: #f2bd8e;
}

body.dinner-mode .option.selected {
    background: #49382d;
    border-color: var(--main);
    color: #ffd2a8;
}

body.dinner-mode .food-tags span {
    background: #49382d;
    color: #f2bd8e;
}

body.dinner-mode footer {
    color: #85818a;
    border-top-color: var(--border);
}

body.dinner-mode .intro h1 span,
body.dinner-mode .logo,
body.dinner-mode .food-number,
body.dinner-mode .selected-count {
    color: var(--main);
}

@media(max-width:650px) {
    .container {padding-top: 35px;}
    .intro h1 {font-size: 29px;}
    .selection-box {padding: 23px 17px;}
    .result-grid {grid-template-columns: 1fr;}
    .header-text {display: none;}
    .option {padding: 9px 12px; font-size: 12px;}
}
</style>
</head>

<script>

// =====================================
// 1. 모드 설정
// =====================================

let currentMode = 'lunch';

function setMode(mode) {
    currentMode = mode;
    document.body.classList.toggle('dinner-mode', mode === 'dinner');

    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
    });

    document.getElementById('resultSection').style.display = 'none';
}


// =====================================
// 2. 키워드 선택 기능
// =====================================

document.querySelectorAll('.option').forEach(button => {

    button.addEventListener('click', function() {

        const group = this.closest('.options');

        if (group.dataset.single === 'true') {
            group.querySelectorAll('.option').forEach(btn => {
                btn.classList.remove('selected');
            });
            this.classList.add('selected');
        } else {
            this.classList.toggle('selected');
        }

        updateCount();
    });

});

function updateCount() {
    const count = document.querySelectorAll('.option.selected').length;

    document.getElementById('selectedCount').textContent =
        `현재 선택한 키워드: ${count}개`;
}

// =====================================
// 4. 선택된 키워드 가져오기
// =====================================

function getSelectedKeywords() {

    const selected = {};

    document.querySelectorAll('.options').forEach(group => {

        selected[group.dataset.category] = Array.from(
            group.querySelectorAll('.option.selected')
        ).map(button => button.dataset.value);

    });

    return selected;
}


// =====================================
// 5. 추천 알고리즘
// =====================================

function recommendFood() {

    const selected = getSelectedKeywords();

    const selectedCount = Object.values(selected)
        .reduce((sum, values) => sum + values.length, 0);

    if (selectedCount === 0) {
        alert('키워드를 하나 이상 선택해 주세요!');
        return;
    }

    const availableFoods = foods.filter(food =>
        food.modes.includes(currentMode)
    );

    // 카테고리별 일치 점수 계산
    const scoredFoods = availableFoods.map(food => {

        let score = 0;
        let matched = 0;

        Object.keys(selected).forEach(category => {

            const keywords = selected[category];

            if (keywords.length === 0) return;

            let foodValues = food[category];

            // 매운맛, 국물, 온도는 단일 값
            if (!Array.isArray(foodValues)) {
                foodValues = foodValues ? [foodValues] : [];
            }

            // 한 카테고리에서 여러 개 선택해도
            // 해당 카테고리 점수는 최대 1점
            const isMatched = keywords.some(keyword =>
                foodValues.includes(keyword)
            );

            if (isMatched) {
                score++;
                matched++;
            }

        });

        return {
            ...food,
            score,
            matched
        };

    });

    // 점수가 높은 음식부터 후보를 구성하되, 특정 종류(예: 빵)에
    // 추천이 몰리지 않도록 주식과 음식 종류의 다양성을 함께 고려
    scoredFoods.sort((a,b) => b.score - a.score);

    const highestScore = scoredFoods[0].score;
    let candidates = scoredFoods.filter(food => food.score >= highestScore - 2);
    candidates.sort(() => Math.random() - 0.5);

    const recommendations = [];
    const usedStaples = new Set();
    const usedTypes = new Set();
    // 점수 차이가 크지 않은 범위에서 서로 다른 주식과 음식 종류를 우선 선택
    while (recommendations.length < 3 && candidates.length > 0) {
        let bestIndex = -1;
        let bestVarietyScore = -Infinity;

        candidates.forEach((food, index) => {
            const stapleKey = (food.staple || [])[0] || '기타';
            const typeKey = (food.type || [])[0] || '기타';
            const varietyScore = food.score
                + (usedStaples.has(stapleKey) ? -1.5 : 1.5)
                + (usedTypes.has(typeKey) ? -0.5 : 0.5)
                + Math.random() * 0.25;

            if (varietyScore > bestVarietyScore) {
                bestVarietyScore = varietyScore;
                bestIndex = index;
            }
        });

        // 다양성 제한으로 후보가 남지 않는 경우 제한 없이 채움
        if (bestIndex === -1) bestIndex = 0;
        const [picked] = candidates.splice(bestIndex, 1);
        recommendations.push(picked);
        usedStaples.add((picked.staple || [])[0] || '기타');
        usedTypes.add((picked.type || [])[0] || '기타');
    }

    // 데이터가 적거나 조건이 좁은 경우에도 최대 3개까지 추천
    if (recommendations.length < 3) {
        const remaining = scoredFoods.filter(food =>
            !recommendations.some(item => item.name === food.name)
        );
        remaining.sort((a, b) => b.score - a.score || Math.random() - 0.5);
        recommendations.push(...remaining.slice(0, 3 - recommendations.length));
    }

    const grid = document.getElementById('resultGrid');
    grid.innerHTML = '';

    recommendations.forEach((food,index) => {

        const card = document.createElement('div');
        card.className = 'food-card';

        const tagValues = [
            ...(food.type || []),
            ...(food.staple || []),
            ...(food.ingredient || []),
            food.spice,
            ...(food.flavor || []),
            food.soup,
            food.temperature
        ].filter(Boolean);

        const tags = [...new Set(tagValues)]
            .slice(0,5)
            .map(tag => `<span>${tag}</span>`)
            .join('');

        card.innerHTML = `
            <div class="food-number">
                RECOMMENDATION 0${index+1}
            </div>

            <div class="food-emoji">${food.emoji}</div>

            <h3>${food.name}</h3>

            <p>${food.desc}</p>

            <div class="food-tags">${tags}</div>
        `;

        grid.appendChild(card);

    });

    const modeName = currentMode === 'lunch' ? '점심' : '저녁';

    document.getElementById('resultDescription').textContent =
        `${modeName} 메뉴 · 선택한 ${selectedCount}개 키워드 기준 추천`;

    document.getElementById('resultNotice').textContent =
        '✨ 선택한 조건과 가장 잘 어울리는 메뉴를 우선 추천했어요!';

    const resultSection = document.getElementById('resultSection');

    resultSection.style.display = 'block';

    resultSection.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
    });

}


// =====================================
// 6. 초기화
// =====================================

function resetSelection() {

    document.querySelectorAll('.option').forEach(button => {
        button.classList.remove('selected');
    });

    updateCount();

    document.getElementById('resultSection').style.display = 'none';

}
